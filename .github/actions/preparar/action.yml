name: Preparar
description: Instala o Node, o npm e as dependências, igual à máquina de desenvolvimento.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: npm

    # O Node 26 vem com o npm 11; localmente usamos o 12, que bloqueia scripts de instalação.
    - run: npm install -g npm@12
      shell: bash

    - run: npm ci
      shell: bash
